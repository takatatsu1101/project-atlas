# Project Atlas Gemini 連携用スクリーニング設定ファイル
# 東証プライム・20日平均売買代金30億円以上・1単元50万円以下（株価5,000円以下）の運用条件に加え、
# 後段AI（Gemini）向けの高密度ブリーフ出力（gemini_brief_*.md / gemini_brief_latest.md）を有効化します。

# 1. 事前スクリーニング設定（通信前ユニバース・財務・流動性フィルタ）
pre_screening:
  # 対象市場区分（東証プライム限定）
  target_markets:
    - "プライム"
  # 最低売上高（円、デフォルト: 100億円）
  min_revenue: 10000000000.0
  # 最低総資産（円、未設定時は null）
  min_total_assets: null
  # 営業黒字を必須とするか
  require_positive_operating_profit: true
  # 最終黒字を必須とするか
  require_positive_net_profit: true
  # 最低ROE（%）
  min_roe: 5.0
  # 最低自己資本比率（%）
  min_equity_ratio: 20.0
  # 流動性判定に用いる直近営業日数
  liquidity_lookback_days: 20
  # 最低平均売買代金（円、30億円以上）
  min_avg_trading_value: 3000000000.0
  # 最低平均出来高（株、未設定時は null）
  min_avg_volume: null
  # 株価上限（円、1単元50万円以下 = 5,000円以下）
  max_close: 5000.0

# 2. 戦略スコア設定（S002_StrategyScore: 3段階ゲート＆2戦略スコアリング）
strategy_score:
  min_trend_env_score: 50.0
  require_above_sma75: true
  gate1_failed_cap: 35.0
  double_top_penalty_threshold: 40.0
  double_top_high_confidence_threshold: 70.0
  double_top_penalty_factor: 0.45
  double_top_high_confidence_cap: 40.0
  extreme_volatility_threshold: 90.0
  extreme_volatility_penalty: 20.0
  extreme_volatility_ratio_threshold: 2.0
  sma75_dev_overheat_threshold: 0.25
  sma75_dev_overheat_penalty: 12.0
  gap_up_overheat_threshold: 0.07
  gap_up_overheat_penalty: 10.0
  pullback_rsi_ideal_min: 40.0
  pullback_rsi_ideal_max: 60.0
  breakout_rsi_ideal_min: 55.0
  breakout_rsi_ideal_max: 75.0
  rsi_overheat_threshold: 80.0
  rsi_overheat_penalty: 8.0
  short_rsi_rebound_bonus: 5.0
  min_pullback_setup_score: 55.0
  min_breakout_setup_score: 55.0
  min_entry_score: 60.0
  watch_score_cap: 59.0
  pullback_weight_p001: 0.32
  pullback_weight_trend_env: 0.20
  pullback_weight_o001: 0.10
  pullback_weight_fundamental: 0.22
  pullback_weight_volatility_stability: 0.12
  pullback_weight_v001: 0.04
  double_bottom_bonus_factor: 0.10
  double_bottom_bonus_max: 6.0
  hammer_bonus_factor: 0.05
  hammer_bonus_max: 5.0
  pullback_dryup_rebound_bonus: 5.0
  breakout_weight_p002: 0.33
  breakout_weight_v001: 0.22
  breakout_weight_o001: 0.10
  breakout_weight_trend_env: 0.13
  breakout_weight_fundamental: 0.22
  fundamental_weight_f001: 0.05
  fundamental_weight_f002: 0.20
  fundamental_weight_f003: 0.50
  fundamental_weight_f004: 0.05
  fundamental_weight_f005: 0.05
  fundamental_weight_f006: 0.15
  require_core_features: true

# 3. スクリーナー抽出設定（ScreeningCriteria）
screener:
  min_total_score: 65.0
  min_trend_env_score: 50.0
  require_gate1_passed: true
  exclude_watch: true
  allowed_strategies:
    - "pullback"
    - "breakout"
  min_pullback_strategy_score: null
  min_breakout_strategy_score: null
  min_fundamental_score: null
  max_double_top_confidence: 60.0
  score_id: "S002_StrategyScore"
  latest_only_per_symbol: true
  apply_market_regime_adjustment: true

# 4. ランキング設定
ranking:
  top_n: 20
  strategy_top_n: 10
  strict_date_match: true

# 5. レポート出力設定
output:
  output_dir: "./output"
  formats:
    - "json"
    - "markdown"
    - "gemini"
  # Google ドライブ デスクトップ版のローカル同期フォルダ（例: ~/Library/CloudStorage/GoogleDrive-.../マイドライブ/ProjectAtlas）
  gemini_brief_copy_dir: null
  # Google Drive API 配信先フォルダID（環境変数 GOOGLE_DRIVE_FOLDER_ID または --brief-drive-folder-id で指定推奨）
  gemini_brief_drive_folder_id: null
  gemini_brief_prefix: "gemini_brief"
  gemini_brief_latest_name: "gemini_brief_latest.md"
  # 継続評価対象の監視銘柄コード一覧（CLI --watch-symbols 指定時はそちらが優先）
  watch_symbols: []

# 6. フォワードリターン検証設定
evaluation:
  horizons:
    - 5
    - 20
    - 60
  entry_price_mode: "signal_close"

# 7. 市場コンテキスト・相対力・地合いレジーム設定（Phase B）
market_context:
  enabled: true
  benchmark_symbol: "1306.T"
  min_universe_size: 20
  min_sector_size: 5
  rs_lookback_short: 20
  rs_lookback_medium: 60
  rs_lookback_long: 120
  rs_weight_short: 0.25
  rs_weight_medium: 0.45
  rs_weight_long: 0.30
  breadth_severe_bearish_threshold: 0.35
  breadth_bearish_threshold: 0.40
  breadth_bullish_threshold: 0.60
  breakout_bearish_threshold_delta: 8.0
  breakout_bearish_score_penalty: 6.0
  pullback_rs_positive_factor: 0.3
  rs_adjustment_max: 4.5
  sector_momentum_adjustment_max: 2.5
  relative_valuation_adjustment_max: 5.5
  total_adjustment_cap: 10.0
