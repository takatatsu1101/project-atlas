# Project Atlas スクリーニング設定ファイル
# 各パラメータを変更することで、ユニバース絞り込み・戦略スコア・抽出条件・ランキング・出力設定を調整できます。

# 1. 事前スクリーニング設定（通信前ユニバース・財務・流動性フィルタ）
pre_screening:
  # 対象市場区分（例: "プライム", "スタンダード", "グロース"）
  target_markets:
    - "プライム"
    - "スタンダード"
  # 最低売上高（円、デフォルト: 100億円）
  min_revenue: 10000000000.0
  # 最低総資産（円、未設定時は null）
  min_total_assets: null
  # 営業黒字を必須とするか
  require_positive_operating_profit: true
  # 最終黒字を必須とするか
  require_positive_net_profit: true
  # 最低ROE（%）
  min_roe: 5.0
  # 最低自己資本比率（%）
  min_equity_ratio: 20.0
  # 流動性判定に用いる直近営業日数
  liquidity_lookback_days: 20
  # 最低平均売買代金（円、デフォルト: 1億円）
  min_avg_trading_value: 100000000.0
  # 最低平均出来高（株、未設定時は null）
  min_avg_volume: null

# 2. 戦略スコア設定（S002_StrategyScore: 3段階ゲート＆2戦略スコアリング）
strategy_score:
  # 第1関門（トレンド環境ゲート）
  min_trend_env_score: 50.0
  require_above_sma75: true
  gate1_failed_cap: 35.0

  # 弱気・過熱ペナルティ設定
  double_top_penalty_threshold: 40.0
  double_top_high_confidence_threshold: 70.0
  double_top_penalty_factor: 0.45
  double_top_high_confidence_cap: 40.0
  extreme_volatility_threshold: 90.0
  extreme_volatility_penalty: 20.0

  # 第2関門・戦略判定設定
  min_pullback_setup_score: 55.0
  min_breakout_setup_score: 55.0
  min_entry_score: 60.0
  watch_score_cap: 59.0

  # 押し目買い戦略（pullback）の重み・裏付け加点
  pullback_weight_p001: 0.40
  pullback_weight_trend_env: 0.25
  pullback_weight_o001: 0.15
  pullback_weight_fundamental: 0.10
  pullback_weight_volatility_stability: 0.10
  double_bottom_bonus_factor: 0.10
  double_bottom_bonus_max: 10.0
  hammer_bonus_factor: 0.05
  hammer_bonus_max: 5.0

  # ブレイクアウト戦略（breakout）の重み
  breakout_weight_p002: 0.35
  breakout_weight_v001: 0.35
  breakout_weight_o001: 0.10
  breakout_weight_trend_env: 0.10
  breakout_weight_fundamental: 0.10

  # 必須特徴量チェックを有効にするか
  require_core_features: true

# 3. スクリーナー抽出設定（ScreeningCriteria）
screener:
  # 最低総合スコア
  min_total_score: 65.0
  # 最低トレンド環境スコア
  min_trend_env_score: 50.0
  # 第1関門通過を必須とするか
  require_gate1_passed: true
  # 見送り（watch）銘柄を除外するか
  exclude_watch: true
  # 抽出を許可する戦略タイプ
  allowed_strategies:
    - "pullback"
    - "breakout"
  # 各サブスコアの下限（未設定時は null）
  min_pullback_strategy_score: null
  min_breakout_strategy_score: null
  min_fundamental_score: null
  # ダブルトップ警戒信頼度の上限（この値以上は除外）
  max_double_top_confidence: 60.0
  # 対象とするスコアID
  score_id: "S002_StrategyScore"
  # 銘柄ごとに最新日のレコードのみを対象とするか
  latest_only_per_symbol: true

# 4. ランキング設定
ranking:
  # 総合ランキング上位件数
  top_n: 20
  # 戦略別ランキング上位件数
  strategy_top_n: 10
  # スコア基準日と特徴量/パターン日付を厳密一致させるか（false で最新日付へフォールバック）
  strict_date_match: true

# 5. レポート出力設定
output:
  # レポート出力先ディレクトリ
  output_dir: "./output"
  # 出力フォーマット一覧
  formats:
    - "json"
    - "markdown"

# 6. フォワードリターン検証設定
evaluation:
  # 検証ホライズン（営業日数）
  horizons:
    - 5
    - 20
    - 60
  # エントリー価格基準（"signal_close" または "next_open"）
  entry_price_mode: "signal_close"
