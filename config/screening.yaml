# Project Atlas スクリーニング設定ファイル
# 各パラメータを変更することで、ユニバース絞り込み・戦略スコア・抽出条件・ランキング・出力設定を調整できます。

# 1. 事前スクリーニング設定（通信前ユニバース・財務・流動性フィルタ）
pre_screening:
  # 対象市場区分（例: "プライム", "スタンダード", "グロース"）
  target_markets:
    - "プライム"
    - "スタンダード"
  # 最低売上高（円、デフォルト: 100億円）
  min_revenue: 10000000000.0
  # 最低総資産（円、未設定時は null）
  min_total_assets: null
  # 営業黒字を必須とするか
  require_positive_operating_profit: true
  # 最終黒字を必須とするか
  require_positive_net_profit: true
  # 最低ROE（%）
  min_roe: 5.0
  # 最低自己資本比率（%）
  min_equity_ratio: 20.0
  # 流動性判定に用いる直近営業日数
  liquidity_lookback_days: 20
  # 最低平均売買代金（円、デフォルト: 1億円）
  min_avg_trading_value: 100000000.0
  # 最低平均出来高（株、未設定時は null）
  min_avg_volume: null

# 2. 戦略スコア設定（S002_StrategyScore: 3段階ゲート＆2戦略スコアリング）
strategy_score:
  # 第1関門（トレンド環境ゲート）
  min_trend_env_score: 50.0
  require_above_sma75: true
  gate1_failed_cap: 35.0

  # 弱気・過熱ペナルティ設定
  double_top_penalty_threshold: 40.0
  double_top_high_confidence_threshold: 70.0
  double_top_penalty_factor: 0.45
  double_top_high_confidence_cap: 40.0
  extreme_volatility_threshold: 90.0
  extreme_volatility_penalty: 20.0
  # 異常ボラティリティ過熱判定（tr_today / avg_atr >= この値 で減点）
  extreme_volatility_ratio_threshold: 2.0
  # 75日移動平均線からの過熱乖離ペナルティ（(close - SMA75) / SMA75 > 閾値）
  sma75_dev_overheat_threshold: 0.25
  sma75_dev_overheat_penalty: 12.0
  # 大幅ギャップアップ過熱ペナルティ（ブレイクアウト戦略から減点）
  gap_up_overheat_threshold: 0.07
  gap_up_overheat_penalty: 10.0

  # 戦略別 RSI ベル型評価・短期反転設定
  pullback_rsi_ideal_min: 40.0
  pullback_rsi_ideal_max: 60.0
  breakout_rsi_ideal_min: 55.0
  breakout_rsi_ideal_max: 75.0
  rsi_overheat_threshold: 80.0
  rsi_overheat_penalty: 8.0
  short_rsi_rebound_bonus: 5.0

  # 第2関門・戦略判定設定
  min_pullback_setup_score: 55.0
  min_breakout_setup_score: 55.0
  min_entry_score: 60.0
  watch_score_cap: 59.0

  # 押し目買い戦略（pullback）の重み・裏付け加点（重み合計 1.0）
  pullback_weight_p001: 0.38
  pullback_weight_trend_env: 0.22
  pullback_weight_o001: 0.15
  pullback_weight_fundamental: 0.10
  pullback_weight_volatility_stability: 0.10
  pullback_weight_v001: 0.05
  double_bottom_bonus_factor: 0.10
  double_bottom_bonus_max: 10.0
  hammer_bonus_factor: 0.05
  hammer_bonus_max: 5.0
  # 押し目売り枯れ後の反発出来高増加点
  pullback_dryup_rebound_bonus: 5.0

  # ブレイクアウト戦略（breakout）の重み
  breakout_weight_p002: 0.35
  breakout_weight_v001: 0.35
  breakout_weight_o001: 0.10
  breakout_weight_trend_env: 0.10
  breakout_weight_fundamental: 0.10

  # 必須特徴量チェックを有効にするか
  require_core_features: true

# 3. スクリーナー抽出設定（ScreeningCriteria）
screener:
  # 最低総合スコア
  min_total_score: 65.0
  # 最低トレンド環境スコア
  min_trend_env_score: 50.0
  # 第1関門通過を必須とするか
  require_gate1_passed: true
  # 見送り（watch）銘柄を除外するか
  exclude_watch: true
  # 抽出を許可する戦略タイプ
  allowed_strategies:
    - "pullback"
    - "breakout"
  # 各サブスコアの下限（未設定時は null）
  min_pullback_strategy_score: null
  min_breakout_strategy_score: null
  min_fundamental_score: null
  # ダブルトップ警戒信頼度の上限（この値以上は除外）
  max_double_top_confidence: 60.0
  # 対象とするスコアID
  score_id: "S002_StrategyScore"
  # 銘柄ごとに最新日のレコードのみを対象とするか
  latest_only_per_symbol: true
  # 地合い悪化レジーム時にブレイクアウト閾値を動的引き上げするか
  apply_market_regime_adjustment: true

# 4. ランキング設定
ranking:
  # 総合ランキング上位件数
  top_n: 20
  # 戦略別ランキング上位件数
  strategy_top_n: 10
  # スコア基準日と特徴量/パターン日付を厳密一致させるか（false で最新日付へフォールバック）
  strict_date_match: true

# 5. レポート出力設定
output:
  # レポート出力先ディレクトリ
  output_dir: "./output"
  # 出力フォーマット一覧
  formats:
    - "json"
    - "markdown"

# 6. フォワードリターン検証設定
evaluation:
  # 検証ホライズン（営業日数）
  horizons:
    - 5
    - 20
    - 60
  # エントリー価格基準（"signal_close" または "next_open"）
  entry_price_mode: "signal_close"

# 7. 市場コンテキスト・相対力・地合いレジーム設定（Phase B）
market_context:
  # MarketContext（対TOPIX相対力・業種モメンタム・業種内相対バリュエーション・地合いレジーム）を有効にするか
  enabled: true
  # 市場ベンチマーク銘柄（TOPIX連動型ETF）
  benchmark_symbol: "1306.T"
  # 横断統計・レジーム判定を有効化する最小ユニバース銘柄数（少銘柄テスト時は中立フォールバック）
  min_universe_size: 20
  # 業種モメンタム・業種内相対評価を有効化する最小同一33業種銘柄数
  min_sector_size: 5
  # 対市場超過リターン算出の営業日ホライズンと合成重み
  rs_lookback_short: 20
  rs_lookback_medium: 60
  rs_lookback_long: 120
  rs_weight_short: 0.25
  rs_weight_medium: 0.45
  rs_weight_long: 0.30
  # Market Breadth（close > SMA25 比率）による地合いレジーム閾値
  breadth_severe_bearish_threshold: 0.35
  breadth_bearish_threshold: 0.40
  breadth_bullish_threshold: 0.60
  # 地合い悪化（bearish）時にブレイクアウト戦略へ適用する動的閾値引き上げ幅・スコア減点幅
  breakout_bearish_threshold_delta: 8.0
  breakout_bearish_score_penalty: 6.0
  # 押し目買い戦略における正のRS補正抑制係数（高β急騰株の過剰評価抑止）
  pullback_rs_positive_factor: 0.3
  # 各補正点の最大振れ幅（+/-）と合計補正キャップ
  rs_adjustment_max: 4.0
  sector_momentum_adjustment_max: 4.0
  relative_valuation_adjustment_max: 4.0
  total_adjustment_cap: 8.0
